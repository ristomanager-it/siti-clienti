<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@600;700;800&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:var(--w);height:var(--h);overflow:hidden;font-family:Manrope,sans-serif}
.c{position:relative;width:100%;height:100%;background:#12302C center/cover no-repeat;color:#FBF3E2}
.c::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,48,44,.25) 0%,rgba(18,48,44,0) 22%,rgba(18,48,44,0) 38%,rgba(18,48,44,.85) 64%,#12302C 100%)}
.top{position:absolute;z-index:2;top:var(--top,56px);left:64px;right:64px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:Fraunces,serif;font-weight:700;font-size:46px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.chip{background:#B3402F;color:#fff;font-weight:800;font-size:24px;padding:10px 20px;border-radius:999px;letter-spacing:.02em}
.giu{position:absolute;z-index:2;left:64px;right:64px;bottom:var(--bot)}
.occh{font-weight:800;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#E7C48A;margin-bottom:18px}
h1{font-family:Fraunces,serif;font-weight:700;font-size:var(--fs);line-height:1.04;color:#fff;margin-bottom:22px;letter-spacing:-.01em}
p{font-size:34px;line-height:1.35;color:#F3E6D2;font-weight:600;margin-bottom:34px}
.cta{display:inline-flex;align-items:center;gap:16px;background:#E7A94B;color:#12302C;font-weight:800;font-size:32px;padding:22px 34px;border-radius:999px}
.cta s{opacity:.55;font-weight:700}
</style></head><body><div class="c" id="c"><div class="top"><span class="logo">Ancora</span><span class="chip" id="chip"></span></div>
<div class="giu"><div class="occh" id="occh"></div><h1 id="t"></h1><p id="s"></p><span class="cta" id="cta"></span></div></div></body></html>
